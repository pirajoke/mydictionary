<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Lexi — языковой тренер</title>
  <link rel="icon" href="{{ url_for('static', filename='mascot/lexi-telegram-avatar-v1.jpg') }}">
  <link rel="stylesheet" href="{{ url_for('miniapp_static', filename='miniapp.css') }}?v=20260917-card-modes-v1">
  {% for section in ('profile', 'words', 'credits', 'languages', 'settings') %}
  <link rel="preload" as="image" type="image/webp" href="{{ url_for('static', filename='miniapp/lexi-section-' ~ section ~ '-v1.webp') }}" fetchpriority="{{ 'high' if section == 'profile' else 'low' }}">
  {% endfor %}
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="{{ url_for('miniapp_static', filename='miniapp-swipe.js') }}?v=20260917-card-modes-v1"></script>
  <script defer src="{{ url_for('miniapp_static', filename='miniapp.js') }}?v=20260917-card-modes-v1"></script>
</head>
<body data-bot-username="{{ bot_username }}">
  <main class="app-shell" aria-live="polite">
    <header class="brand-bar">
      <img class="brand-mark" src="{{ url_for('static', filename='mascot/lexi-telegram-avatar-v1.jpg') }}" alt="" aria-hidden="true">
      <div><strong>Lexi</strong><small id="current-language"></small></div>
      <button id="change-learning-language" class="language-shortcut" type="button" data-action="lang" data-i18n="change_learning_language" hidden></button>
    </header>

    <section id="loading-state" class="state-card dashboard-state loading" data-ui-state="loading" role="status">
      <span class="spinner" aria-hidden="true"></span><span data-i18n="loading"></span>
    </section>
    <section id="error-state" class="state-card dashboard-state error" data-ui-state="error" role="alert" hidden>
      <p id="bootstrap-error-message" data-i18n="error"></p><button id="retry-button" type="button" data-i18n="retry"></button><a id="reopen-telegram" hidden></a>
    </section>

    <div id="app-content" class="dashboard" hidden>
      <section id="panel-profile" class="panel dashboard-panel active" role="tabpanel" data-panel="profile" aria-labelledby="tab-profile">
        <section class="learn-now" aria-labelledby="learn-now-title">
          <h1 id="learn-now-title" data-i18n="learn_now"></h1>
          <p id="learn-now-hint" data-i18n="first_lesson_hint"></p>
          <button id="learn-now-action" class="primary-action dashboard-action" type="button" data-action="continue" data-i18n="start_first_lesson"></button>
          <div class="learn-now-secondary"><button type="button" data-action="review" data-i18n="review_words"></button><button type="button" data-action="words" data-i18n="choose_words"></button></div>
        </section>
        <p id="profile-reorder-instructions" class="visually-hidden" data-i18n="profile_reorder_instructions"></p>
        <div id="profile-reorder-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="profile-layout" data-profile-layout>
        <header class="section-heading dashboard-header section-hero" data-profile-section="hero" tabindex="0" aria-describedby="profile-reorder-instructions">
          <h1 id="profile-label" data-i18n="profile"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-profile-v1.webp') }}" alt="" loading="eager" decoding="async" fetchpriority="high" width="1200" height="600">
        </header>

        <section class="streak-card dashboard-section" aria-labelledby="calendar-title" data-profile-section="calendar" tabindex="0" aria-describedby="profile-reorder-instructions">
          <div class="calendar-header">
            <button id="calendar-previous" type="button" data-i18n-aria-label="previous_month"><span aria-hidden="true">‹</span></button>
            <h2 id="calendar-title" class="visually-hidden" data-i18n="calendar_activity"></h2>
            <strong id="calendar-month"></strong>
            <button id="calendar-next" type="button" data-i18n-aria-label="next_month"><span aria-hidden="true">›</span></button>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-labelledby="calendar-title"></div>
          <span id="streak-count" hidden>0</span>
          <span data-i18n="streak_days" hidden></span>
          <span data-i18n="best_streak_short" hidden></span>
        </section>

        <div class="profile-identity dashboard-section" data-profile-section="identity" tabindex="0" aria-describedby="profile-reorder-instructions">
          <div class="avatar-shell">
            <img id="profile-photo" alt="" hidden>
            <span id="profile-avatar-fallback" aria-hidden="true"></span>
          </div>
          <div class="profile-copy">
            <h2 id="display-name"></h2>
            <p id="profile-language"></p>
            <div class="credit-chip"><span aria-hidden="true">✦</span><strong id="profile-credit-balance"></strong><span data-i18n="metric_ai_credits"></span></div>
          </div>
          <button class="profile-share secondary-action dashboard-action" type="button" data-action="share" data-i18n-aria-label="share">
            <span aria-hidden="true">↗</span><span class="visually-hidden" data-i18n="share_profile"></span>
          </button>
        </div>

        <section id="daily-quest" class="daily-quest dashboard-section" aria-labelledby="daily-quest-title" data-profile-section="daily-quest" tabindex="0" aria-describedby="profile-reorder-instructions">
          <span class="quest-icon" aria-hidden="true">🎯</span>
          <div class="daily-quest-copy">
            <h2 id="daily-quest-title" data-i18n="daily_quest"></h2>
            <p id="first-lesson-hint" class="first-lesson-hint" hidden></p>
            <div class="daily-quest-values">
              <span><b id="daily-quest-goal">0</b> <span data-i18n="metric_daily_goal"></span></span>
              <span><b id="daily-quest-today-xp">0</b> <span data-i18n="metric_today_xp"></span></span>
            </div>
          </div>
          <button id="daily-quest-action" class="primary-action dashboard-action" type="button" data-action="continue" data-i18n="continue_lesson"></button>
        </section>

        <section id="profile-game-progress" class="profile-game-progress dashboard-section" aria-labelledby="profile-game-title" data-profile-section="game-progress" tabindex="0" aria-describedby="profile-reorder-instructions">
          <span class="game-icon" aria-hidden="true">🏆</span>
          <div class="profile-level-copy">
            <span id="profile-game-title" data-i18n="metric_level"></span>
            <strong id="profile-level">0</strong>
          </div>
          <div class="profile-xp-copy">
            <span data-i18n="metric_xp"></span>
            <strong id="profile-xp">0</strong>
          </div>
        </section>

        <section id="profile-achievements" class="profile-achievements" role="list" data-i18n-aria-label="profile" data-profile-section="achievements" tabindex="0" aria-describedby="profile-reorder-instructions">
          <div class="profile-achievement" role="listitem">
            <span class="achievement-icon" aria-hidden="true">🔥</span>
            <strong id="achievement-streak-value">0</strong>
            <span data-i18n="metric_streak"></span>
          </div>
          <div class="profile-achievement" role="listitem">
            <span class="achievement-icon" aria-hidden="true">🎯</span>
            <strong id="achievement-accuracy-value">0/0</strong>
            <span data-i18n="metric_accuracy"></span>
          </div>
          <div class="profile-achievement" role="listitem">
            <span class="achievement-icon" aria-hidden="true">🏅</span>
            <strong id="achievement-learned-value">0</strong>
            <span data-i18n="metric_learned_words"></span>
          </div>
        </section>

        <details class="progress-details dashboard-section" data-profile-section="more-stats" tabindex="0" aria-describedby="profile-reorder-instructions">
          <summary data-i18n="more_stats"></summary>
          <span id="best-streak" hidden>0</span>
          <div class="metric-grid" id="profile-metrics"></div>
          <section id="tutor-history" class="tutor-history" aria-labelledby="tutor-history-title" hidden>
            <header class="tutor-history-heading">
              <span aria-hidden="true">🦊</span>
              <h3 id="tutor-history-title" data-i18n="tutor_history_title"></h3>
              <span id="tutor-history-count" class="tutor-history-count"></span>
            </header>
            <p class="tutor-history-hint" data-i18n="tutor_history_hint"></p>
            <div id="tutor-history-list" class="tutor-history-list"></div>
          </section>
        </details>
        </div>
      </section>

      <section id="panel-words" class="panel dashboard-panel" role="tabpanel" data-panel="words" aria-labelledby="tab-words" hidden>
        <header class="section-heading dashboard-header section-hero">
          <h1 id="words-heading" data-i18n="words"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-words-v1.webp') }}" alt="" loading="eager" decoding="async" fetchpriority="low" width="1200" height="600">
        </header>
        <section id="swipe-trainer" class="swipe-trainer" aria-labelledby="swipe-title">
          <header class="swipe-heading">
            <div><h2 id="swipe-title"></h2></div>
            <button id="swipe-language" class="swipe-language" type="button"></button>
          </header>
          <p id="swipe-hint" class="swipe-hint"></p>
          <p id="swipe-mode-label" class="swipe-mode-label"></p>
          <div id="swipe-modes" class="swipe-modes" role="group" aria-labelledby="swipe-mode-label" aria-describedby="swipe-mode-help">
            <button type="button" data-swipe-mode="mix" aria-pressed="true"></button>
            <button type="button" data-swipe-mode="forgotten" aria-pressed="false"></button>
            <button type="button" data-swipe-mode="new" aria-pressed="false"></button>
          </div>
          <p id="swipe-mode-help" class="swipe-mode-help" aria-live="polite"></p>
          <div id="swipe-controls" class="swipe-session" hidden>
            <div class="swipe-session-line"><span id="swipe-count"></span><progress id="swipe-progress" max="10" value="0"></progress></div>
            <div class="swipe-stage">
              <article id="swipe-card" class="swipe-card" tabindex="0" aria-labelledby="swipe-target" aria-describedby="swipe-keyboard-hint">
                <span id="swipe-kind" class="swipe-kind"></span>
                <div class="swipe-word-block">
                  <h3 id="swipe-target" dir="auto"></h3>
                  <div class="swipe-pronunciation"><button id="swipe-speak" type="button"></button><details id="swipe-ipa"><summary data-i18n="pronunciation_symbols"></summary><span id="swipe-transcription" dir="ltr"></span><p data-i18n="ipa_explanation"></p></details></div>
                </div>
                <p id="swipe-meaning" class="swipe-meaning" dir="auto" hidden></p>
                <div id="swipe-context" class="swipe-context" hidden><p id="swipe-grammar" dir="auto"></p><p id="swipe-example" dir="auto"></p><p id="swipe-example-meaning" dir="auto"></p></div>
                <button id="swipe-reveal" class="swipe-reveal" type="button" aria-controls="swipe-meaning" aria-expanded="false"></button>
              </article>
            </div>
            <div class="swipe-grades"><button id="swipe-again" class="swipe-again" type="button"></button><button id="swipe-know" class="swipe-know" type="button"></button></div>
            <p id="swipe-keyboard-hint" class="swipe-keyboard-hint"></p>
          </div>
          <p id="swipe-summary" class="swipe-summary" role="status" hidden></p>
          <button id="swipe-undo" class="swipe-undo" type="button" disabled hidden></button>
          <button id="swipe-resume" class="swipe-start" type="button" hidden></button>
          <button id="swipe-pause" class="swipe-undo" type="button" hidden></button>
          <button id="swipe-start" class="swipe-start" type="button" aria-describedby="swipe-mode-help swipe-status" disabled></button>
          <p id="swipe-status" class="swipe-status" aria-live="polite" aria-atomic="true"></p>
          <button id="swipe-retry" class="swipe-retry" type="button" hidden></button>
        </section>
        <details id="custom-vocabulary-actions" class="words-disclosure custom-vocabulary-actions">
          <summary>
            <span class="words-disclosure-icon" aria-hidden="true">＋</span>
            <span class="words-disclosure-label"><strong data-i18n="custom_words_add"></strong><small data-i18n="custom_words_hint"></small></span>
            <span class="words-disclosure-chevron" aria-hidden="true">›</span>
          </summary>
          <div class="words-disclosure-body">
            <div class="custom-vocabulary-copy">
              <h2 id="custom-vocabulary-title" data-i18n="custom_words_title"></h2>
            </div>
            <div class="custom-vocabulary-controls">
              <button class="custom-vocabulary-practice dashboard-action" type="button" data-action="practice_custom"><span aria-hidden="true">▶</span><span data-i18n="custom_words_practice"></span></button>
              <button class="custom-vocabulary-add dashboard-action" type="button" data-action="add_words"><span aria-hidden="true">＋</span><span data-i18n="custom_words_add"></span></button>
            </div>
          </div>
        </details>
        <details class="words-disclosure dictionary-entry">
          <summary>
            <span class="words-disclosure-icon" aria-hidden="true">⌕</span>
            <span class="words-disclosure-label"><strong data-i18n="words"></strong><small data-i18n="dictionary_hint"></small></span>
            <span class="words-disclosure-chevron" aria-hidden="true">›</span>
          </summary>
          <div class="words-disclosure-body dictionary-entry-body">
            <p class="device-dictionary-note" data-i18n="device_dictionary_note"></p>
            <div class="dictionary-entry-actions">
              <button class="primary-action dashboard-action" type="button" data-open-dictionary data-i18n="dictionary_open"></button>
              <button class="dashboard-action" type="button" data-download-dictionary data-i18n="dictionary_download"></button>
            </div>
          </div>
        </details>
        <details class="word-library" data-words-disclosure>
          <summary>
            <span class="words-disclosure-icon" aria-hidden="true">≡</span>
            <span class="words-disclosure-label">
              <strong data-i18n="word_library_title"></strong>
              <small><span data-i18n="custom_words_saved"></span> <b id="custom-word-summary-count">0</b> · <span data-i18n="dictionary_tracked"></span> <b id="tracked-word-summary-count">0</b></small>
            </span>
            <span class="words-disclosure-chevron" aria-hidden="true">›</span>
          </summary>
          <div class="words-disclosure-body">
          <div class="word-library-tabs" role="tablist" data-i18n-aria-label="word_library_title">
            <button id="word-library-custom-tab" class="word-library-tab" type="button" role="tab" aria-selected="true" aria-controls="word-library-custom-panel" tabindex="0" data-word-library-tab="custom">
              <span data-i18n="custom_words_saved"></span>
              <strong id="custom-word-count">0</strong>
            </button>
            <button id="word-library-tracked-tab" class="word-library-tab" type="button" role="tab" aria-selected="false" aria-controls="word-library-tracked-panel" tabindex="-1" data-word-library-tab="tracked">
              <span data-i18n="dictionary_tracked"></span>
              <strong id="tracked-word-count">0</strong>
            </button>
          </div>
          <section id="word-library-custom-panel" class="word-library-panel" role="tabpanel" aria-labelledby="word-library-custom-tab" tabindex="0" data-word-library-panel="custom">
            <div id="custom-word-list" class="word-list dashboard-list"></div>
            <p id="empty-custom-words" class="custom-words-empty" data-i18n="custom_words_empty"></p>
            <nav id="custom-word-pager" class="word-library-pager" data-word-library-pager="custom" data-i18n-aria-label="word_library_title" hidden>
              <button id="custom-word-page-previous" class="dashboard-action" type="button" data-word-library-page="custom" data-page-direction="previous" data-i18n="word_library_previous"></button>
              <span id="custom-word-page-status" role="status" aria-live="polite"></span>
              <button id="custom-word-page-next" class="dashboard-action" type="button" data-word-library-page="custom" data-page-direction="next" data-i18n="word_library_next"></button>
            </nav>
          </section>
          <section id="word-library-tracked-panel" class="word-library-panel" role="tabpanel" aria-labelledby="word-library-tracked-tab" tabindex="0" data-word-library-panel="tracked" hidden>
            <div id="word-summary" class="word-overview" role="list"></div>
            <div id="word-list" class="word-list dashboard-list"></div>
            <div id="empty-words" class="state-card dashboard-state empty" data-ui-state="empty" role="status" hidden><p data-i18n="empty_words"></p><button class="dashboard-action" type="button" data-action="continue" data-i18n="start_lesson"></button></div>
            <nav id="tracked-word-pager" class="word-library-pager" data-word-library-pager="tracked" data-i18n-aria-label="word_library_title" hidden>
              <button id="tracked-word-page-previous" class="dashboard-action" type="button" data-word-library-page="tracked" data-page-direction="previous" data-i18n="word_library_previous"></button>
              <span id="tracked-word-page-status" role="status" aria-live="polite"></span>
              <button id="tracked-word-page-next" class="dashboard-action" type="button" data-word-library-page="tracked" data-page-direction="next" data-i18n="word_library_next"></button>
            </nav>
          </section>
          </div>
        </details>
      </section>

      <section id="panel-credits" class="panel dashboard-panel" role="tabpanel" data-panel="credits" aria-labelledby="tab-credits" hidden>
        <header class="section-heading dashboard-header section-hero">
          <h1 id="credits-heading" data-i18n="credits"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-credits-v1.webp') }}" alt="" loading="eager" decoding="async" fetchpriority="low" width="1200" height="600">
        </header>
        <section class="wallet-card" aria-labelledby="wallet-available-label">
          <div class="wallet-primary">
            <span id="wallet-available-label" data-i18n="credit_available"></span>
            <strong><span aria-hidden="true">✦</span><span id="wallet-available">0</span></strong>
          </div>
          <div id="credit-summary" class="wallet-secondary"></div>
        </section>
        <button class="ai-entry dashboard-action" type="button" data-action="ai"><span aria-hidden="true">✦</span><span data-i18n="ai_tutor"></span></button>
        <p id="credit-contract" class="credit-contract" data-i18n="credit_contract"></p>
        <section id="referral-card" class="referral-card dashboard-section" aria-labelledby="referral-title">
          <div class="referral-copy">
            <h2 id="referral-title" data-i18n="referral_title"></h2>
            <p data-i18n="referral_body"></p>
          </div>
          <div class="referral-orbit" aria-hidden="true"><span>✦</span><i></i><i></i><i></i></div>
          <div class="referral-stats" role="list">
            <div role="listitem"><strong id="referral-invited">0</strong><span data-i18n="referral_invited"></span></div>
            <div role="listitem"><strong id="referral-activated">0</strong><span data-i18n="referral_activated"></span></div>
            <div role="listitem"><strong id="referral-earned">0</strong><span data-i18n="referral_earned"></span></div>
          </div>
          <p class="referral-terms" data-i18n="referral_terms"></p>
          <button id="referral-invite" class="referral-invite-button dashboard-action" type="button" data-referral-invite data-i18n="referral_invite"></button>
          <p id="referral-status" class="referral-status" data-referral-status role="status" aria-live="polite"></p>
        </section>
        <div id="product-list" class="dashboard-list"></div>
        <p id="checkout-disabled" class="checkout-state dashboard-state disabled" data-ui-state="disabled" data-i18n="checkout_disabled" role="status" hidden></p>
      </section>

      <section id="panel-languages" class="panel dashboard-panel" role="tabpanel" data-panel="languages" aria-labelledby="tab-languages" hidden>
        <header class="section-heading dashboard-header section-hero">
          <h1 id="languages-heading" data-i18n="languages"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-languages-v1.webp') }}" alt="" loading="eager" decoding="async" fetchpriority="low" width="1200" height="600">
        </header>
        <div id="language-current" class="language-spotlight"></div>
        <div id="language-list" class="choice-list dashboard-list"></div>
        <button class="language-action dashboard-action" type="button" data-action="lang" data-i18n="change_language"></button>
      </section>

      <section id="panel-settings" class="panel dashboard-panel" role="tabpanel" data-panel="settings" aria-labelledby="tab-settings" hidden>
        <header class="section-heading dashboard-header section-hero">
          <h1 id="settings-heading" data-i18n="settings"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-settings-v1.webp') }}" alt="" loading="eager" decoding="async" fetchpriority="low" width="1200" height="600">
        </header>
        <button id="settings-credit-cta" class="settings-credit-cta dashboard-action" type="button" data-settings-target="credits" aria-describedby="settings-credit-balance">
          <span class="settings-cta-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 2.8 1.7 5 5 1.7-5 1.7-1.7 5-1.7-5-5-1.7 5-1.7 1.7-5Z"></path><path d="m18.4 14.5.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1Z"></path></svg>
          </span>
          <span class="settings-row-copy">
            <strong data-i18n="settings_credit_cta"></strong>
            <small class="settings-row-value"><span id="settings-credit-balance">0</span> <span data-i18n="credit_available"></span></small>
          </span>
          <svg class="settings-cta-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
        </button>

        <section id="settings-account-group" class="settings-group">
          <h2 data-i18n="settings_group_features"></h2>
          <div class="settings-hub-list dashboard-section">
            <button id="settings-invite" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="invite" data-referral-invite aria-describedby="settings-invite-status">
              <span class="settings-icon-tile settings-tile--blue" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10" cy="8" r="3"></circle><path d="M4.8 18c.6-3.3 2.3-5 5.2-5 1.5 0 2.7.4 3.6 1.3M17.5 7v6M14.5 10h6"></path></svg></span>
              <span class="settings-row-copy"><strong data-i18n="referral_invite"></strong></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
            <p id="settings-invite-status" class="referral-status settings-inline-status" data-referral-status role="status" aria-live="polite"></p>
          </div>
        </section>

        <section id="settings-learning-group" class="settings-group">
          <h2 data-i18n="settings_group_learning"></h2>
          <div id="settings-learning" class="settings-hub-list dashboard-section">
            <button id="settings-dictionary" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="lang">
              <span class="settings-icon-tile settings-tile--cyan" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4.5h8.5A2.5 2.5 0 0 1 16 7v12H7.5A2.5 2.5 0 0 1 5 16.5v-12Z"></path><path d="M8 8h5M8 11h5M7.5 19A2.5 2.5 0 0 1 10 16.5h6"></path></svg></span>
