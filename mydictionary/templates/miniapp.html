<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>MY DICTIONARY</title>
  <link rel="stylesheet" href="{{ url_for('miniapp_static', filename='miniapp.css') }}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="{{ url_for('miniapp_static', filename='miniapp.js') }}"></script>
</head>
<body data-bot-username="{{ bot_username }}">
  <main class="app-shell" aria-live="polite">
    <header class="brand-bar">
      <img class="brand-mark" src="{{ url_for('static', filename='admin/brand-mark.png') }}" alt="" aria-hidden="true">
      <div><strong>MY DICTIONARY</strong><small id="current-language"></small></div>
    </header>

    <section id="loading-state" class="state-card loading" role="status">
      <span class="spinner" aria-hidden="true"></span><span data-i18n="loading"></span>
    </section>
    <section id="error-state" class="state-card error" hidden>
      <p data-i18n="error"></p><button id="retry-button" type="button" data-i18n="retry"></button>
    </section>

    <div id="app-content" hidden>
      <section id="panel-profile" class="panel active" role="tabpanel" data-panel="profile" aria-labelledby="tab-profile">
        <h1 class="visually-hidden" id="profile-label" data-i18n="profile"></h1>
        <div class="profile-identity">
          <div class="avatar-shell">
            <img id="profile-photo" alt="" hidden>
            <span id="profile-avatar-fallback" aria-hidden="true"></span>
          </div>
          <h2 id="display-name"></h2>
          <p id="profile-language"></p>
          <div class="credit-chip"><span aria-hidden="true">✦</span><strong id="profile-credit-balance"></strong><span data-i18n="credits"></span></div>
        </div>

        <div class="profile-actions">
          <button class="primary-action" type="button" data-action="learn"><span aria-hidden="true">▶</span><span data-i18n="continue_lesson"></span></button>
          <button class="secondary-action" type="button" data-action="share" data-i18n-aria-label="share"><span aria-hidden="true">↗</span><span data-i18n="share_profile"></span></button>
        </div>

        <section class="streak-card" aria-labelledby="calendar-title">
          <div class="streak-summary">
            <span class="flame" aria-hidden="true">🔥</span>
            <div><strong id="streak-count">0</strong><span data-i18n="streak_days"></span></div>
            <p><span data-i18n="best_streak_short"></span> <b id="best-streak">0</b></p>
          </div>
          <div class="calendar-header">
            <button id="calendar-previous" type="button" data-i18n-aria-label="previous_month"><span aria-hidden="true">‹</span></button>
            <h2 id="calendar-title" class="visually-hidden" data-i18n="calendar_activity"></h2>
            <strong id="calendar-month"></strong>
            <button id="calendar-next" type="button" data-i18n-aria-label="next_month"><span aria-hidden="true">›</span></button>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-labelledby="calendar-title"></div>
        </section>

        <details class="progress-details">
          <summary data-i18n="profile"></summary>
          <div class="metric-grid" id="profile-metrics"></div>
        </details>
      </section>

      <section id="panel-words" class="panel" role="tabpanel" data-panel="words" aria-labelledby="tab-words" hidden>
        <header class="section-heading">
          <h1 id="words-heading" data-i18n="words"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/miniapp-section-words.webp') }}" alt="" loading="lazy" decoding="async" width="1200" height="600">
        </header>
        <div id="word-summary" class="word-overview" role="list"></div>
        <div id="word-list" class="word-list"></div>
        <div id="empty-words" class="state-card empty" hidden><p data-i18n="empty_words"></p><button type="button" data-action="learn" data-i18n="start_lesson"></button></div>
      </section>

      <section id="panel-credits" class="panel" role="tabpanel" data-panel="credits" aria-labelledby="tab-credits" hidden>
        <header class="section-heading">
          <h1 id="credits-heading" data-i18n="credits"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/miniapp-section-credits.webp') }}" alt="" loading="lazy" decoding="async" width="1200" height="600">
        </header>
        <section class="wallet-card" aria-labelledby="wallet-available-label">
          <div class="wallet-primary">
            <span id="wallet-available-label" data-i18n="credit_available"></span>
            <strong><span aria-hidden="true">✦</span><span id="wallet-available">0</span></strong>
          </div>
          <div id="credit-summary" class="wallet-secondary"></div>
        </section>
        <button class="ai-entry" type="button" data-action="ai"><span aria-hidden="true">✦</span><span data-i18n="ai_tutor"></span></button>
        <p id="credit-contract" class="credit-contract" data-i18n="credit_contract"></p>
        <div id="product-list"></div>
        <p id="checkout-disabled" class="checkout-state" data-i18n="checkout_disabled" role="status" hidden></p>
      </section>

      <section id="panel-languages" class="panel" role="tabpanel" data-panel="languages" aria-labelledby="tab-languages" hidden>
        <header class="section-heading">
          <h1 id="languages-heading" data-i18n="languages"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/miniapp-section-languages.webp') }}" alt="" loading="lazy" decoding="async" width="1200" height="400">
        </header>
        <div id="language-current" class="language-spotlight"></div>
        <div id="language-list" class="choice-list"></div>
        <button class="language-action" type="button" data-action="lang" data-i18n="change_language"></button>
      </section>

      <section id="panel-settings" class="panel" role="tabpanel" data-panel="settings" aria-labelledby="tab-settings" hidden>
        <header class="settings-hero">
          <h1 id="settings-heading" data-i18n="settings"></h1>
          <div class="settings-visual" aria-hidden="true">
            <span><i></i></span><span><i></i></span><span><i></i></span>
          </div>
        </header>
        <section class="settings-group">
          <h2 data-i18n="settings_group_learning"></h2>
          <dl id="settings-learning"></dl>
        </section>
        <section class="settings-group">
          <h2 data-i18n="settings_group_tutor"></h2>
          <dl id="settings-tutor"></dl>
        </section>
        <section class="settings-group">
          <h2 data-i18n="settings_group_features"></h2>
          <dl id="settings-features"></dl>
        </section>
        <div class="action-grid"><button type="button" data-action="settings" data-i18n="open_settings"></button><button type="button" data-action="privacy" data-i18n="privacy"></button></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" role="tablist" data-i18n-aria-label="navigation_label" hidden>
    <button id="tab-profile" type="button" role="tab" aria-selected="true" aria-controls="panel-profile" tabindex="0" data-tab="profile">
      <span class="nav-icon nav-icon-profile" aria-hidden="true">
        <svg class="nav-glyph" data-icon="profile" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="12" cy="8" r="5"></circle>
          <circle cx="12" cy="7.7" r="2.75"></circle>
          <path d="M5.8 19.2c.5-4 2.7-6 6.2-6s5.7 2 6.2 6c-1.8 1.2-3.9 1.8-6.2 1.8s-4.4-.6-6.2-1.8Z"></path>
        </svg>
      </span>
      <span data-i18n="profile"></span>
    </button>
    <button id="tab-words" type="button" role="tab" aria-selected="false" aria-controls="panel-words" tabindex="-1" data-tab="words">
      <span class="nav-icon nav-icon-words" aria-hidden="true">
        <svg class="nav-glyph" data-icon="words" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="icon-soft" d="M4.2 5.2c2.8-.7 5.2-.1 7.8 1.4v13c-2.6-1.5-5-2.1-7.8-1.4v-13Z"></path>
          <path d="M12 6.6c2.6-1.5 5-2.1 7.8-1.4v13c-2.8-.7-5.2-.1-7.8 1.4v-13Z"></path>
          <path class="icon-stroke" d="M12 6.6v13M15.1 8.4h2.7M15.1 11h2.7"></path>
        </svg>
      </span>
      <span data-i18n="words"></span>
    </button>
    <button id="tab-credits" type="button" role="tab" aria-selected="false" aria-controls="panel-credits" tabindex="-1" data-tab="credits">
      <span class="nav-icon nav-icon-credits" aria-hidden="true">
        <svg class="nav-glyph" data-icon="credits" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="7" cy="17" r="3.2"></circle>
          <path d="m13 3.2 1.5 4.3 4.3 1.5-4.3 1.5-1.5 4.3-1.5-4.3L7.2 9l4.3-1.5L13 3.2Z"></path>
          <path d="m18.2 14.1.7 2 .1.1 2 .7-2 .7-.1.1-.7 2-.7-2-.1-.1-2-.7 2-.7.1-.1.7-2Z"></path>
        </svg>
      </span>
      <span data-i18n="credits"></span>
    </button>
    <button id="tab-languages" type="button" role="tab" aria-selected="false" aria-controls="panel-languages" tabindex="-1" data-tab="languages">
      <span class="nav-icon nav-icon-languages" aria-hidden="true">
        <svg class="nav-glyph" data-icon="languages" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="12" cy="12" r="8.7"></circle>
          <circle class="icon-stroke" cx="12" cy="12" r="8"></circle>
          <path class="icon-stroke" d="M4.4 12h15.2M12 4c2.1 2.1 3.2 4.8 3.2 8S14.1 17.9 12 20M12 4C9.9 6.1 8.8 8.8 8.8 12s1.1 5.9 3.2 8"></path>
        </svg>
      </span>
      <span data-i18n="languages"></span>
    </button>
    <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1" data-tab="settings">
      <span class="nav-icon nav-icon-settings" aria-hidden="true">
        <svg class="nav-glyph" data-icon="settings" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="8" cy="7" r="3.6"></circle>
          <path class="icon-stroke" d="M4 7h16M4 17h16"></path>
          <circle cx="8" cy="7" r="2.1"></circle>
          <circle cx="16" cy="17" r="2.1"></circle>
        </svg>
      </span>
      <span data-i18n="settings"></span>
    </button>
  </nav>
</body>
</html>
