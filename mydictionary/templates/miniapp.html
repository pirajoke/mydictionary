<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Lexi — языковой тренер</title>
  <link rel="icon" href="{{ url_for('static', filename='mascot/lexi-telegram-avatar-v1.jpg') }}">
  <link rel="stylesheet" href="{{ url_for('miniapp_static', filename='miniapp.css') }}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="{{ url_for('miniapp_static', filename='miniapp.js') }}"></script>
</head>
<body data-bot-username="{{ bot_username }}">
  <main class="app-shell" aria-live="polite">
    <header class="brand-bar">
      <img class="brand-mark" src="{{ url_for('static', filename='mascot/lexi-telegram-avatar-v1.jpg') }}" alt="" aria-hidden="true">
      <div><strong>Lexi</strong><small id="current-language"></small></div>
    </header>

    <section id="loading-state" class="state-card dashboard-state loading" data-ui-state="loading" role="status">
      <span class="spinner" aria-hidden="true"></span><span data-i18n="loading"></span>
    </section>
    <section id="error-state" class="state-card dashboard-state error" data-ui-state="error" role="alert" hidden>
      <p data-i18n="error"></p><button id="retry-button" type="button" data-i18n="retry"></button>
    </section>

    <div id="app-content" class="dashboard" hidden>
      <section id="panel-profile" class="panel dashboard-panel active" role="tabpanel" data-panel="profile" aria-labelledby="tab-profile">
        <header class="section-heading dashboard-header profile-header">
          <h1 id="profile-label" data-i18n="profile"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-profile-v1.webp') }}" alt="" decoding="async" width="1200" height="600">
        </header>
        <div class="profile-identity dashboard-section">
          <div class="avatar-shell">
            <img id="profile-photo" alt="" hidden>
            <span id="profile-avatar-fallback" aria-hidden="true"></span>
          </div>
          <div class="profile-copy">
            <h2 id="display-name"></h2>
            <p id="profile-language"></p>
            <div class="credit-chip"><span aria-hidden="true">✦</span><strong id="profile-credit-balance"></strong><span data-i18n="metric_ai_credits"></span></div>
          </div>
          <button class="profile-share secondary-action dashboard-action" type="button" data-action="share" data-i18n-aria-label="share">
            <span aria-hidden="true">↗</span><span class="visually-hidden" data-i18n="share_profile"></span>
          </button>
        </div>

        <section id="profile-game-progress" class="profile-game-progress dashboard-section" aria-labelledby="profile-game-title">
          <span class="game-icon" aria-hidden="true">🏆</span>
          <div class="profile-level-copy">
            <span id="profile-game-title" data-i18n="metric_level"></span>
            <strong id="profile-level">0</strong>
          </div>
          <div class="profile-xp-copy">
            <span data-i18n="metric_xp"></span>
            <strong id="profile-xp">0</strong>
          </div>
        </section>

        <section id="profile-achievements" class="profile-achievements" role="list" data-i18n-aria-label="profile">
          <div class="profile-achievement" role="listitem">
            <span class="achievement-icon" aria-hidden="true">🔥</span>
            <strong id="achievement-streak-value">0</strong>
            <span data-i18n="metric_streak"></span>
          </div>
          <div class="profile-achievement" role="listitem">
            <span class="achievement-icon" aria-hidden="true">🎯</span>
            <strong id="achievement-accuracy-value">0/0</strong>
            <span data-i18n="metric_accuracy"></span>
          </div>
          <div class="profile-achievement" role="listitem">
            <span class="achievement-icon" aria-hidden="true">🏅</span>
            <strong id="achievement-learned-value">0</strong>
            <span data-i18n="metric_learned_words"></span>
          </div>
        </section>

        <section id="daily-quest" class="daily-quest dashboard-section" aria-labelledby="daily-quest-title">
          <span class="quest-icon" aria-hidden="true">🎯</span>
          <div class="daily-quest-copy">
            <h2 id="daily-quest-title" data-i18n="daily_quest"></h2>
            <div class="daily-quest-values">
              <span><b id="daily-quest-goal">0</b> <span data-i18n="metric_daily_goal"></span></span>
              <span><b id="daily-quest-today-xp">0</b> <span data-i18n="metric_today_xp"></span></span>
            </div>
          </div>
          <button class="primary-action dashboard-action" type="button" data-action="learn" data-i18n="continue_lesson"></button>
        </section>

        <section class="streak-card dashboard-section" aria-labelledby="calendar-title">
          <div class="calendar-header">
            <button id="calendar-previous" type="button" data-i18n-aria-label="previous_month"><span aria-hidden="true">‹</span></button>
            <h2 id="calendar-title" class="visually-hidden" data-i18n="calendar_activity"></h2>
            <strong id="calendar-month"></strong>
            <button id="calendar-next" type="button" data-i18n-aria-label="next_month"><span aria-hidden="true">›</span></button>
          </div>
          <div id="calendar-grid" class="calendar-grid" role="grid" aria-labelledby="calendar-title"></div>
          <span id="streak-count" hidden>0</span>
          <span data-i18n="streak_days" hidden></span>
          <span data-i18n="best_streak_short" hidden></span>
        </section>

        <details class="progress-details dashboard-section">
          <summary data-i18n="more_stats"></summary>
          <span id="best-streak" hidden>0</span>
          <div class="metric-grid" id="profile-metrics"></div>
        </details>
      </section>

      <section id="panel-words" class="panel dashboard-panel" role="tabpanel" data-panel="words" aria-labelledby="tab-words" hidden>
        <header class="section-heading dashboard-header">
          <h1 id="words-heading" data-i18n="words"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-words-v1.webp') }}" alt="" loading="lazy" decoding="async" width="1200" height="600">
        </header>
        <div id="word-summary" class="word-overview" role="list"></div>
        <div id="word-list" class="word-list dashboard-list"></div>
        <div id="empty-words" class="state-card dashboard-state empty" data-ui-state="empty" role="status" hidden><p data-i18n="empty_words"></p><button class="dashboard-action" type="button" data-action="learn" data-i18n="start_lesson"></button></div>
      </section>

      <section id="panel-credits" class="panel dashboard-panel" role="tabpanel" data-panel="credits" aria-labelledby="tab-credits" hidden>
        <header class="section-heading dashboard-header">
          <h1 id="credits-heading" data-i18n="credits"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-credits-v1.webp') }}" alt="" loading="lazy" decoding="async" width="1200" height="600">
        </header>
        <section class="wallet-card" aria-labelledby="wallet-available-label">
          <div class="wallet-primary">
            <span id="wallet-available-label" data-i18n="credit_available"></span>
            <strong><span aria-hidden="true">✦</span><span id="wallet-available">0</span></strong>
          </div>
          <div id="credit-summary" class="wallet-secondary"></div>
        </section>
        <button class="ai-entry dashboard-action" type="button" data-action="ai"><span aria-hidden="true">✦</span><span data-i18n="ai_tutor"></span></button>
        <p id="credit-contract" class="credit-contract" data-i18n="credit_contract"></p>
        <section id="referral-card" class="referral-card dashboard-section" aria-labelledby="referral-title">
          <div class="referral-copy">
            <h2 id="referral-title" data-i18n="referral_title"></h2>
            <p data-i18n="referral_body"></p>
          </div>
          <div class="referral-orbit" aria-hidden="true"><span>✦</span><i></i><i></i><i></i></div>
          <div class="referral-stats" role="list">
            <div role="listitem"><strong id="referral-invited">0</strong><span data-i18n="referral_invited"></span></div>
            <div role="listitem"><strong id="referral-activated">0</strong><span data-i18n="referral_activated"></span></div>
            <div role="listitem"><strong id="referral-earned">0</strong><span data-i18n="referral_earned"></span></div>
          </div>
          <p class="referral-terms" data-i18n="referral_terms"></p>
          <button id="referral-invite" class="referral-invite-button dashboard-action" type="button" data-referral-invite data-i18n="referral_invite"></button>
          <p id="referral-status" class="referral-status" data-referral-status role="status" aria-live="polite"></p>
        </section>
        <div id="product-list" class="dashboard-list"></div>
        <p id="checkout-disabled" class="checkout-state dashboard-state disabled" data-ui-state="disabled" data-i18n="checkout_disabled" role="status" hidden></p>
      </section>

      <section id="panel-languages" class="panel dashboard-panel" role="tabpanel" data-panel="languages" aria-labelledby="tab-languages" hidden>
        <header class="section-heading dashboard-header">
          <h1 id="languages-heading" data-i18n="languages"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-languages-v1.webp') }}" alt="" loading="lazy" decoding="async" width="1200" height="600">
        </header>
        <div id="language-current" class="language-spotlight"></div>
        <div id="language-list" class="choice-list dashboard-list"></div>
        <button class="language-action dashboard-action" type="button" data-action="lang" data-i18n="change_language"></button>
      </section>

      <section id="panel-settings" class="panel dashboard-panel" role="tabpanel" data-panel="settings" aria-labelledby="tab-settings" hidden>
        <header class="settings-hero dashboard-header">
          <h1 id="settings-heading" data-i18n="settings"></h1>
          <img class="section-art" src="{{ url_for('static', filename='miniapp/lexi-section-settings-v1.webp') }}" alt="" loading="lazy" decoding="async" width="1200" height="600">
        </header>
        <button id="settings-credit-cta" class="settings-credit-cta dashboard-action" type="button" data-settings-target="credits" aria-describedby="settings-credit-balance">
          <span class="settings-cta-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 2.8 1.7 5 5 1.7-5 1.7-1.7 5-1.7-5-5-1.7 5-1.7 1.7-5Z"></path><path d="m18.4 14.5.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8.8-2.1Z"></path></svg>
          </span>
          <span class="settings-row-copy">
            <strong data-i18n="settings_credit_cta"></strong>
            <small class="settings-row-value"><span id="settings-credit-balance">0</span> <span data-i18n="credit_available"></span></small>
          </span>
          <svg class="settings-cta-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
        </button>

        <section id="settings-account-group" class="settings-group">
          <h2 data-i18n="settings_group_features"></h2>
          <div class="settings-hub-list dashboard-section">
            <button id="settings-invite" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="invite" data-referral-invite aria-describedby="settings-invite-status">
              <span class="settings-icon-tile settings-tile--blue" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10" cy="8" r="3"></circle><path d="M4.8 18c.6-3.3 2.3-5 5.2-5 1.5 0 2.7.4 3.6 1.3M17.5 7v6M14.5 10h6"></path></svg></span>
              <span class="settings-row-copy"><strong data-i18n="referral_invite"></strong></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
            <p id="settings-invite-status" class="referral-status settings-inline-status" data-referral-status role="status" aria-live="polite"></p>
          </div>
        </section>

        <section id="settings-learning-group" class="settings-group">
          <h2 data-i18n="settings_group_learning"></h2>
          <div id="settings-learning" class="settings-hub-list dashboard-section">
            <button id="settings-dictionary" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="lang">
              <span class="settings-icon-tile settings-tile--cyan" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4.5h8.5A2.5 2.5 0 0 1 16 7v12H7.5A2.5 2.5 0 0 1 5 16.5v-12Z"></path><path d="M8 8h5M8 11h5M7.5 19A2.5 2.5 0 0 1 10 16.5h6"></path></svg></span>
              <span class="settings-row-copy"><strong data-i18n="settings_dictionary"></strong><small id="settings-dictionary-value" class="settings-row-value"></small></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
            <button id="settings-learning-plan" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="settings">
              <span class="settings-icon-tile settings-tile--orange" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2M7 4.5 5 6.5M17 4.5l2 2"></path></svg></span>
              <span class="settings-row-copy"><strong data-i18n="settings_learning_plan"></strong><small id="settings-learning-plan-value" class="settings-row-value"></small><span class="visually-hidden" data-i18n="open_settings"></span></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
            <div id="settings-interface-locale" class="settings-locale-row dashboard-row">
              <span class="settings-icon-tile settings-tile--violet" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"></circle><path d="M4.5 12h15M12 4c2 2.2 3 4.8 3 8s-1 5.8-3 8M12 4c-2 2.2-3 4.8-3 8s1 5.8 3 8"></path></svg></span>
              <span class="settings-row-copy"><strong id="settings-interface-locale-label" data-i18n="setting_interface_language"></strong><span id="settings-interface-locale-control" class="settings-locale-control"></span></span>
            </div>
          </div>
        </section>

        <section id="settings-tutor-group" class="settings-group">
          <h2 data-i18n="settings_group_tutor"></h2>
          <div id="settings-tutor" class="settings-hub-list dashboard-section">
            <button id="settings-ai-tutor" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="ai">
              <span class="settings-icon-tile settings-tile--violet" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3"></path><circle cx="12" cy="12" r="5.5"></circle><path d="m10 11 1.3 1.3L14.5 9"></path></svg></span>
              <span class="settings-row-copy"><strong data-i18n="ai_tutor"></strong><small id="settings-ai-tutor-value" class="settings-row-value"></small></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
            <button id="settings-tutor-preferences" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="settings">
              <span class="settings-icon-tile settings-tile--green" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 17h16"></path><circle cx="9" cy="7" r="2.2"></circle><circle cx="15" cy="17" r="2.2"></circle></svg></span>
              <span class="settings-row-copy"><strong data-i18n="settings_tutor_preferences"></strong><small id="settings-tutor-preferences-value" class="settings-row-value"></small></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
            <span id="settings-features" class="visually-hidden"><span data-i18n="setting_ai"></span>: <span id="settings-feature-ai"></span> · <span data-i18n="setting_voice"></span>: <span id="settings-feature-voice"></span></span>
          </div>
        </section>

        <section id="settings-support-group" class="settings-group">
          <h2 data-i18n="settings_group_support"></h2>
          <div class="settings-hub-list dashboard-section">
            <button id="settings-help" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="help">
              <span class="settings-icon-tile settings-tile--cyan" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8"></circle><path d="M9.8 9.2a2.4 2.4 0 0 1 4.6 1c0 1.8-2.4 2.1-2.4 3.8M12 17.5h.01"></path></svg></span>
              <span class="settings-row-copy"><strong data-i18n="settings_help"></strong></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
            <button id="settings-privacy" class="settings-hub-row dashboard-row dashboard-action" type="button" data-settings-action="privacy">
              <span class="settings-icon-tile settings-tile--slate" aria-hidden="true"><svg class="settings-row-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5 19 6v5.2c0 4.4-2.8 7.6-7 9.3-4.2-1.7-7-4.9-7-9.3V6l7-2.5Z"></path><path d="m9.2 12 1.8 1.8 3.8-4"></path></svg></span>
              <span class="settings-row-copy"><strong data-i18n="privacy"></strong></span>
              <svg class="settings-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9 5 7 7-7 7"></path></svg>
            </button>
          </div>
        </section>
        <span data-action="settings" hidden></span><span data-action="privacy" hidden></span>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" role="tablist" data-i18n-aria-label="navigation_label" hidden>
    <button id="tab-profile" type="button" role="tab" aria-selected="true" aria-controls="panel-profile" tabindex="0" data-tab="profile">
      <span class="nav-icon nav-icon-profile" aria-hidden="true">
        <svg class="nav-glyph" data-icon="profile" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="12" cy="8" r="5"></circle>
          <circle cx="12" cy="7.7" r="2.75"></circle>
          <path d="M5.8 19.2c.5-4 2.7-6 6.2-6s5.7 2 6.2 6c-1.8 1.2-3.9 1.8-6.2 1.8s-4.4-.6-6.2-1.8Z"></path>
        </svg>
      </span>
      <span data-i18n="profile"></span>
    </button>
    <button id="tab-words" type="button" role="tab" aria-selected="false" aria-controls="panel-words" tabindex="-1" data-tab="words">
      <span class="nav-icon nav-icon-words" aria-hidden="true">
        <svg class="nav-glyph" data-icon="words" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path class="icon-soft" d="M4.2 5.2c2.8-.7 5.2-.1 7.8 1.4v13c-2.6-1.5-5-2.1-7.8-1.4v-13Z"></path>
          <path d="M12 6.6c2.6-1.5 5-2.1 7.8-1.4v13c-2.8-.7-5.2-.1-7.8 1.4v-13Z"></path>
          <path class="icon-stroke" d="M12 6.6v13M15.1 8.4h2.7M15.1 11h2.7"></path>
        </svg>
      </span>
      <span data-i18n="words"></span>
    </button>
    <button id="tab-credits" type="button" role="tab" aria-selected="false" aria-controls="panel-credits" tabindex="-1" data-tab="credits">
      <span class="nav-icon nav-icon-credits" aria-hidden="true">
        <svg class="nav-glyph" data-icon="credits" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="7" cy="17" r="3.2"></circle>
          <path d="m13 3.2 1.5 4.3 4.3 1.5-4.3 1.5-1.5 4.3-1.5-4.3L7.2 9l4.3-1.5L13 3.2Z"></path>
          <path d="m18.2 14.1.7 2 .1.1 2 .7-2 .7-.1.1-.7 2-.7-2-.1-.1-2-.7 2-.7.1-.1.7-2Z"></path>
        </svg>
      </span>
      <span data-i18n="credits"></span>
    </button>
    <button id="tab-languages" type="button" role="tab" aria-selected="false" aria-controls="panel-languages" tabindex="-1" data-tab="languages">
      <span class="nav-icon nav-icon-languages" aria-hidden="true">
        <svg class="nav-glyph" data-icon="languages" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="12" cy="12" r="8.7"></circle>
          <circle class="icon-stroke" cx="12" cy="12" r="8"></circle>
          <path class="icon-stroke" d="M4.4 12h15.2M12 4c2.1 2.1 3.2 4.8 3.2 8S14.1 17.9 12 20M12 4C9.9 6.1 8.8 8.8 8.8 12s1.1 5.9 3.2 8"></path>
        </svg>
      </span>
      <span data-i18n="languages"></span>
    </button>
    <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1" data-tab="settings">
      <span class="nav-icon nav-icon-settings" aria-hidden="true">
        <svg class="nav-glyph" data-icon="settings" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle class="icon-soft" cx="8" cy="7" r="3.6"></circle>
          <path class="icon-stroke" d="M4 7h16M4 17h16"></path>
          <circle cx="8" cy="7" r="2.1"></circle>
          <circle cx="16" cy="17" r="2.1"></circle>
        </svg>
      </span>
      <span data-i18n="settings"></span>
    </button>
  </nav>
</body>
</html>
