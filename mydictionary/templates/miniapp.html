<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>MY DICTIONARY</title>
  <link rel="stylesheet" href="{{ url_for('miniapp_static', filename='miniapp.css') }}">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="{{ url_for('miniapp_static', filename='miniapp.js') }}"></script>
</head>
<body data-bot-username="{{ bot_username }}">
  <main class="app-shell" aria-live="polite">
    <header class="brand-bar">
      <img class="brand-mark" src="{{ url_for('static', filename='admin/brand-mark.png') }}" alt="" aria-hidden="true">
      <div><strong>MY DICTIONARY</strong><small id="current-language"></small></div>
    </header>

    <section id="loading-state" class="state-card loading" role="status">
      <span class="spinner" aria-hidden="true"></span><span data-i18n="loading"></span>
    </section>
    <section id="error-state" class="state-card error" hidden>
      <p data-i18n="error"></p><button id="retry-button" type="button" data-i18n="retry"></button>
    </section>

    <div id="app-content" hidden>
      <section id="panel-profile" class="panel active" role="tabpanel" data-panel="profile" aria-labelledby="tab-profile">
        <div class="hero-card"><p class="eyebrow" id="profile-label" data-i18n="profile"></p><h1 id="display-name"></h1><div class="metric-grid" id="profile-metrics"></div></div>
        <div class="action-grid"><button type="button" data-action="learn"><span aria-hidden="true">▶</span> <span data-i18n="continue_lesson"></span></button><button type="button" data-action="ai"><span aria-hidden="true">✦</span> <span data-i18n="ai_tutor"></span></button><button type="button" data-action="share"><span aria-hidden="true">↗</span> <span data-i18n="share"></span></button></div>
      </section>
      <section id="panel-words" class="panel" role="tabpanel" data-panel="words" aria-labelledby="tab-words" hidden>
        <h1 id="words-heading" data-i18n="words"></h1><div id="word-list" class="word-list"></div>
        <div id="empty-words" class="state-card empty" hidden><p data-i18n="empty_words"></p><button type="button" data-action="learn" data-i18n="start_lesson"></button></div>
      </section>
      <section id="panel-credits" class="panel" role="tabpanel" data-panel="credits" aria-labelledby="tab-credits" hidden>
        <h1 id="credits-heading" data-i18n="credits"></h1><div id="credit-summary" class="metric-grid"></div><p id="credit-contract" class="paper-card" data-i18n="credit_contract"></p><div id="product-list"></div><p id="checkout-disabled" class="state-card disabled" data-i18n="checkout_disabled" hidden></p>
      </section>
      <section id="panel-languages" class="panel" role="tabpanel" data-panel="languages" aria-labelledby="tab-languages" hidden>
        <h1 id="languages-heading" data-i18n="languages"></h1><div id="language-list" class="choice-list"></div><button type="button" data-action="lang" data-i18n="change_language"></button>
      </section>
      <section id="panel-settings" class="panel" role="tabpanel" data-panel="settings" aria-labelledby="tab-settings" hidden>
        <h1 id="settings-heading" data-i18n="settings"></h1><dl id="settings-list" class="paper-card"></dl><div class="action-grid"><button type="button" data-action="settings" data-i18n="open_settings"></button><button type="button" data-action="privacy" data-i18n="privacy"></button></div>
      </section>
    </div>
  </main>

  <nav class="bottom-nav" role="tablist" data-i18n-aria-label="navigation_label" hidden>
    <button id="tab-profile" type="button" role="tab" aria-selected="true" aria-controls="panel-profile" tabindex="0" data-tab="profile"><span aria-hidden="true">◉</span><span data-i18n="profile"></span></button>
    <button id="tab-words" type="button" role="tab" aria-selected="false" aria-controls="panel-words" tabindex="-1" data-tab="words"><span aria-hidden="true">Aa</span><span data-i18n="words"></span></button>
    <button id="tab-credits" type="button" role="tab" aria-selected="false" aria-controls="panel-credits" tabindex="-1" data-tab="credits"><span aria-hidden="true">✦</span><span data-i18n="credits"></span></button>
    <button id="tab-languages" type="button" role="tab" aria-selected="false" aria-controls="panel-languages" tabindex="-1" data-tab="languages"><span aria-hidden="true">◎</span><span data-i18n="languages"></span></button>
    <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1" data-tab="settings"><span aria-hidden="true">⚙</span><span data-i18n="settings"></span></button>
  </nav>
</body>
</html>
