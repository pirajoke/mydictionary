<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Восстановление доступа — MY DICTIONARY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
  </head>
  <body class="login-page">
    <main class="login-panel">
      <p class="eyebrow">MY DICTIONARY</p>
      <h1>Восстановление доступа</h1>
      {% if submitted %}
        <div class="notice">Если адрес совпадает с адресом администратора, ссылка для сброса уже отправлена.</div>
      {% else %}
        <p>Введите почту администратора.</p>
        <form method="post" class="form-stack">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label>Почта<input type="email" name="email" autocomplete="email" required autofocus></label>
          <button type="submit" class="primary">Отправить ссылку</button>
        </form>
      {% endif %}
      <p class="login-back"><a href="{{ url_for('admin_login') }}">Вернуться ко входу</a></p>
    </main>
  </body>
</html>
