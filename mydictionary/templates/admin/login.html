<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MY DICTIONARY Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
  </head>
  <body class="login-page">
    <main class="login-panel">
      <img src="{{ url_for('static', filename='admin/brand-mark.png') }}" alt="" width="72" height="72">
      <p class="eyebrow">MY DICTIONARY</p>
      <h1>Администрирование</h1>
      {% if unavailable %}
        <div class="notice error">Админка не настроена. Задайте ADMIN_USERNAME, ADMIN_PASSWORD_HASH и ADMIN_SESSION_SECRET.</div>
      {% else %}
        {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
        <form method="post" class="form-stack">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label>Логин<input name="username" autocomplete="username" required autofocus></label>
          <label>Пароль<input type="password" name="password" autocomplete="current-password" required></label>
          <button type="submit" class="primary">Войти</button>
        </form>
      {% endif %}
    </main>
  </body>
</html>
