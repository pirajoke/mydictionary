<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый пароль — MY DICTIONARY</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/admin.css') }}">
  </head>
  <body class="login-page">
    <main class="login-panel">
      <p class="eyebrow">MY DICTIONARY</p>
      <h1>Новый пароль</h1>
      {% if invalid %}
        <div class="notice error">Ссылка недействительна или устарела.</div>
      {% else %}
        {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
        <form method="post" class="form-stack">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <label>Новый пароль<input type="password" name="password" autocomplete="new-password" minlength="12" required autofocus></label>
          <label>Повторите пароль<input type="password" name="password_confirm" autocomplete="new-password" minlength="12" required></label>
          <button type="submit" class="primary">Сохранить пароль</button>
        </form>
      {% endif %}
      <p class="login-back"><a href="{{ url_for('admin_login') }}">Вернуться ко входу</a></p>
    </main>
  </body>
</html>
